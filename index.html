<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboards | Safetypro</title>
  <style>
    :root {
      --green: #039935;
      --teal: #00A8B5;
      --silver: #BBC7CE;
      --brown: #4C1C00;
      --slate: #4F5D75;
      --bg-page: #f4f7f9;
      --bg-surface: #ffffff;
      --bg-tint: #eef3f6;
      --border: #d5dfe6;
      --text-main: #1e293b;
      --text-muted: #4F5D75;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(0, 168, 181, 0.10), transparent 40%),
        radial-gradient(circle at top left, rgba(3, 153, 53, 0.08), transparent 38%),
        var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* Cabecera */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 3px solid var(--green);
    }

    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo {
      height: 44px;
      width: auto;
      max-width: 240px;
      object-fit: contain;
      display: block;
    }

    .brand-divider {
      width: 1px;
      height: 28px;
      background: var(--silver);
    }

    .brand-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--slate);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(0, 168, 181, 0.12);
      color: var(--slate);
      border: 1px solid rgba(0, 168, 181, 0.35);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    /* Contenido principal */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.25rem 1.25rem 3.5rem;
    }

    .hero {
      margin-bottom: 1.65rem;
      padding-left: 1rem;
      border-left: 4px solid var(--teal);
    }

    .hero h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.5rem, 3vw, 2rem);
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 0.72rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--slate);
      opacity: 0.8;
    }

    .search-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0, 168, 181, 0.18);
    }

    .count-badge {
      padding: 0.68rem 0.95rem;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--slate);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Grid de tarjetas */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
      gap: 1rem;
    }

    a.card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem;
      border-radius: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: inherit;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    a.card:hover {
      transform: translateY(-2px);
      border-color: var(--green);
      box-shadow: 0 8px 20px rgba(79, 93, 117, 0.12);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.3;
      color: var(--text-main);
      word-break: break-word;
    }

    .card-arrow {
      color: var(--teal);
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform 0.18s ease, color 0.18s ease;
      flex-shrink: 0;
    }

    a.card:hover .card-arrow {
      color: var(--green);
      transform: translate(2px, -2px);
    }

    .card-desc {
      margin-top: 0.45rem;
      font-size: 0.89rem;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--bg-tint);
      font-size: 0.8rem;
      color: var(--slate);
    }

    .card-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-tag {
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: rgba(3, 153, 53, 0.12);
      color: var(--green);
      font-weight: 600;
      font-size: 0.74rem;
      flex-shrink: 0;
    }

    .state-box {
      grid-column: 1 / -1;
      padding: 2rem;
      border-radius: 14px;
      background: var(--bg-surface);
      border: 1px dashed var(--silver);
      text-align: center;
      color: var(--slate);
    }

    .error-accent {
      color: var(--brown);
      font-weight: 600;
    }

    @media (max-width: 560px) {
      .brand-divider,
      .brand-label {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./">
        <img
          class="brand-logo"
          src="./Safetypro H5.png"
          alt="Safetypro"
        />
        <span class="brand-divider" aria-hidden="true"></span>
        <span id="org-label" class="brand-label">Organización</span>
      </a>

      <span class="status-pill">
        <span class="status-dot"></span>
        GitHub Org Sync
      </span>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 id="hero-title">Dashboards de la Organización</h1>
      <p>Acceso directo a los repositorios publicados en GitHub Pages.</p>
    </section>

    <section class="toolbar" aria-label="Filtrar proyectos">
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="Buscar por nombre, descripción o lenguaje..."
        autocomplete="off"
      />
      <div id="repo-count" class="count-badge">Cargando...</div>
    </section>

    <section id="repos-grid" class="grid" aria-live="polite">
      <div class="state-box">Cargando repositorios de la organización...</div>
    </section>
  </main>

  <script>
    // Cambia este valor por el nombre exacto de tu organización en GitHub:
    const ORG_NAME = "NOMBRE_DE_TU_ORGANIZACION";

    const API_URL = `https://api.github.com/orgs/${ORG_NAME}/repos?per_page=100&sort=updated`;
    const ROOT_REPO = `${ORG_NAME}.github.io`;

    document.getElementById("org-label").textContent = ORG_NAME;
    document.getElementById("hero-title").textContent = `Dashboards | ${ORG_NAME}`;

    let allRepos = [];

    function renderRepos(list) {
      const grid = document.getElementById("repos-grid");
      const countEl = document.getElementById("repo-count");

      countEl.textContent = `${list.length} ${list.length === 1 ? "proyecto" : "proyectos"}`;

      if (list.length === 0) {
        grid.innerHTML = `<div class="state-box">No se encontraron repositorios que coincidan con la búsqueda.</div>`;
        return;
      }

      grid.innerHTML = "";
      list.forEach((repo) => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = `./${repo.name}/`;

        const descHtml = repo.description
          ? `<div class="card-desc">${escapeHtml(repo.description)}</div>`
          : `<div class="card-desc">Proyecto publicado en subruta de GitHub Pages.</div>`;

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="card-title">${escapeHtml(repo.name)}</div>
              <span class="card-arrow">↗</span>
            </div>
            ${descHtml}
          </div>
          <div class="card-footer">
            <span class="card-url">./${escapeHtml(repo.name)}/</span>
            <span class="card-tag">${repo.language ? escapeHtml(repo.language) : "Web"}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function cargarRepositorios() {
      const grid = document.getElementById("repos-grid");
      const countEl = document.getElementById("repo-count");

      try {
        if (!ORG_NAME || ORG_NAME === "NOMBRE_DE_TU_ORGANIZACION") {
          throw new Error("Configura ORG_NAME con el nombre de tu organización en GitHub");
        }

        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("No se pudieron obtener los repositorios de la organización");
        const repos = await res.json();

        allRepos = repos.filter(
          (repo) =>
            repo.name.toLowerCase() !== ROOT_REPO.toLowerCase() &&
            !repo.fork &&
            !repo.archived
        );

        renderRepos(allRepos);
      } catch (err) {
        countEl.textContent = "Error";
        grid.innerHTML = `<div class="state-box"><span class="error-accent">Error al cargar repositorios:</span> ${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        renderRepos(allRepos);
        return;
      }
      const filtrados = allRepos.filter(
        (repo) =>
          repo.name.toLowerCase().includes(q) ||
          (repo.description && repo.description.toLowerCase().includes(q)) ||
          (repo.language && repo.language.toLowerCase().includes(q))
      );
      renderRepos(filtrados);
    });

    cargarRepositorios();
  </script>
</body>
</html>
